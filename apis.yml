apis:
- aid: xendit:xendit-payment-requests-api
  name: Xendit Payment Requests API
  tags:
  - Payments
  - Payment Requests
  - Virtual Accounts
  - E-Wallet
  - Cards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.xendit.co/apidocs/create-payment-request
