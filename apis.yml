aid: xendit
url: https://raw.githubusercontent.com/api-evangelist/xendit/refs/heads/main/apis.yml
name: Xendit
kind: company
description: Xendit is a payments infrastructure provider for Southeast Asia, giving
  businesses in Indonesia, the Philippines, and the wider region a single REST API
  to accept payments, disburse funds, and manage money movement. The unified Payments
  API accepts virtual accounts, e-wallets (OVO, DANA, GoPay, ShopeePay, GCash,
  GrabPay, Maya), QR (QRIS / QR Ph), cards, direct debit, and retail outlets through
  Payment Requests and Payment Tokens; complementary APIs cover hosted Invoices,
  Payouts / disbursements, Balance, Transactions, Customers, and Refunds. All
  requests are authenticated with a secret API key over HTTP Basic against the base
  host https://api.xendit.co.
