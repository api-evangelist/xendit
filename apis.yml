  baseURL: https://api.xendit.co
  properties:
  - url: https://docs.xendit.co/apidocs/create-payment-token
    type: APIReference
  - url: openapi/xendit-openapi.yml
    type: OpenAPI
  description: Save an end user's payment method as a reusable payment token for
    future and recurring transactions, then reference it from a payment request.
    Part of the v3 Payments API and gated by the api-version header (2024-11-11).
