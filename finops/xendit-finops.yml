description: >-
  FinOps view of Xendit spend. Xendit is a usage-priced payments platform: there
  is no subscription or API platform fee, and cost is incurred per transaction.
  Money accepted carries a payment-method fee (a percentage, a flat fee, or
  both, varying by country and channel) plus a Xendit processing fee; money
  disbursed carries a payout fee (typically a percentage with a per-transaction
  minimum). Local taxes apply on top - for example Indonesia adds 11% PPN VAT to
  processing fees. Refunds and reversals can carry their own handling. Because
  fees scale directly with payment volume and channel mix, cost optimization is
  primarily about steering customers toward lower-fee channels and negotiating
  volume rates.
notes: >-
  Per-transaction rates are representative and NOT reconciled; they vary by
  country, channel, and negotiated merchant terms. Verify against
  https://www.xendit.co/en-id/pricing/, https://www.xendit.co/en-ph/pricing/,
  and the Billing Fee Structure in the Xendit dashboard.
