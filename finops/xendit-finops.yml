meters:
- name: acceptance_percentage_fee
  description: Percentage payment-method fee on accepted transactions, varying by channel and country.
  unit: percent
  aggregation: sum
  dimensions:
  - account
  - country
  - channel
- name: acceptance_flat_fee
  description: Flat per-transaction fee on accepted payments (e.g. IDR 4,000 processing, PHP 11.00).
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - country
  - channel
- name: payout_fee
  description: Fee on disbursements / payouts to bank accounts and e-wallets (percentage plus minimum).
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - country
  - channel
- name: tax
  description: Local taxes applied on top of fees (e.g. 11% PPN VAT in Indonesia).
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - country
- name: refund_handling
  description: Any handling associated with refunds and reversals.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - channel
principles:
- name: Visibility
  description: Pull the Transactions API and dashboard reports to attribute fees per channel, country, and product.
- name: Allocation
  description: Tag payment requests and payouts with reference_id / metadata to map fees to teams, storefronts, or sub-accounts (xenPlatform for-user-id).
- name: Optimization
  description: Steer customers toward lower-fee channels (e.g. virtual account or QRIS vs. cards), batch or minimize small payouts to reduce fixed per-transaction fees, and negotiate volume rates.
- name: Accountability
  description: Review monthly fee and tax totals per channel against payment volume; assign owners per product line and reconcile against the Billing Fee Structure.
